name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SLauncher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release (public download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SLauncher.apk
          gh release delete latest --cleanup-tag -y --repo ${{ github.repository }} || true
          gh release create latest SLauncher.apk --title "Latest" --notes "Latest build" --target ${{ github.sha }} --repo ${{ github.repository }}
